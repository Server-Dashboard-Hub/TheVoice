<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;800&family=Outfit:wght@500;800&family=Plus+Jakarta+Sans:wght@500;700;800&family=Protest+Strike&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0505; --panel:#140808; --panel2:#1f0a0a; --line:#3d1414;
  --ink:#f8f5ff; --muted:#a99494; --red:#e62a2a; --gold:#ffd166; --green:#2ecc71;
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --number-font:"Protest Strike", sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;font-family:var(--body);color:var(--ink);background:
  radial-gradient(900px 420px at 50% -10%,rgba(230,42,42,.12),transparent 60%),
  radial-gradient(700px 380px at 10% 20%,rgba(255,209,102,.07),transparent 60%),var(--bg);
  min-height:100vh;line-height:1.42; overflow-x:hidden;
  position: relative;
}
body::before {
  content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none; z-index: -1;
  background: 
    radial-gradient(900px 420px at 30% 10%, rgba(230,42,42,.1), transparent 60%),
    radial-gradient(800px 400px at 80% 70%, rgba(255,209,102,.04), transparent 60%);
}
#app { transition: opacity 0.3s ease; will-change: opacity; }
#app.enter { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes popIn {
  0% { opacity: 0; transform: translateY(10px) scale(0.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.wrap{max-width:100%;margin:0 auto;padding:0 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 8px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:.02em;color:var(--red);cursor:pointer;transition:transform .2s ease;}
.brand:hover{transform:scale(1.03);}
.who{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}
.net{font-size:.8rem}
select,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%;transition:border-color .2s ease,box-shadow .2s ease;}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-color:var(--gold);box-shadow:0 0 8px rgba(255,209,102,0.3);}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 16px;font-weight:600;transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease;}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(230,42,42,0.2);border-color:rgba(230,42,42,0.5);}
button:active:not(:disabled){transform:scale(0.95);box-shadow:none}
button.primary{background:linear-gradient(135deg,#ff4d4d,#e62a2a);border-color:var(--red);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(230,42,42,0.3);}
button.ghost{background:transparent}
button.danger{color:#ffb3b3}
button:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.hero{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4vw,3.2rem);line-height:1.05;margin:20px 8px 12px;letter-spacing:-.02em;background:linear-gradient(135deg,#ff6b6b 0%,#ff3838 50%,#ffd166 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
h2{font-family:var(--display);font-size:1.4rem;margin:0}
h3{font-family:var(--display);margin:0 0 8px}
.hint{color:var(--muted);margin:0 0 12px;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:16px;align-items:start;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,0.3);transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(230,42,42,0.15);border-color:rgba(230,42,42,0.4);}
.card.team-type-odd{background:linear-gradient(140deg,rgba(28,8,8,.95),rgba(16,4,4,.95));border-color:rgba(230,42,42,.45);}
.card.team-type-even{background:linear-gradient(140deg,rgba(36,12,10,.95),rgba(20,6,5,.95));border-color:rgba(255,107,107,.35);}
.season-card{cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:22px;min-height:130px;justify-content:center;}
.season-card:hover{transform:translateY(-4px);box-shadow:0 10px 25px rgba(230,42,42,0.25);border-color:var(--red);}
.season-card .s-title{font-family:var(--display);font-size:1.7rem;font-weight:800;color:var(--ink);line-height:1.1;}
.season-card .s-meta{color:var(--muted);font-size:.9rem;}
.season-card .s-winner{margin-top:6px;display:inline-block;padding:3px 10px;background:rgba(255,209,102,.12);color:var(--gold);border:1px solid rgba(255,209,102,.35);border-radius:6px;font-weight:700;font-size:.8rem;}
.team-header{position:relative;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px;display:flex;align-items:center;justify-content:center;min-height:36px;}
.team-header h3{margin:0;font-size:1.4rem;font-weight:800;color:var(--gold);text-align:center;}
.team-header .add-btn-left{position:absolute;left:0;opacity:0;transition:opacity .2s ease;padding:4px 8px;font-size:.85rem;}
.card:hover .team-header .add-btn-left{opacity:1;}
.team-header .talent-count-right{position:absolute;right:0;display:flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;}
.stage-bar-wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:0 8px 12px;border-bottom:1px solid var(--line);padding-bottom:8px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;}
.tabs button{border-radius:999px;background:transparent;padding:8px 18px;font-size:.95rem;font-weight:600;}
.tabs button.on{background:linear-gradient(135deg,var(--ink),#dcd6f7);color:var(--bg);border-color:var(--ink);font-weight:800;}
.controls-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:0 8px 16px;}
.search-bar-wrap{display:inline-flex;gap:6px;align-items:center;width:100%;max-width:320px;}
.search-bar-wrap input{width:100%;background:var(--panel);border-color:var(--line);font-size:.9rem;padding:8px 12px;}
.view-switch{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;}
.view-switch button{background:transparent;border:none;border-radius:999px;padding:8px 18px;font-weight:600;font-size:.9rem;color:var(--muted);box-shadow:none!important;transform:none!important;}
.view-switch button.active{background:linear-gradient(135deg,#ff4d4d,#e62a2a);color:#fff;font-weight:700;}
.row{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;align-items:center;margin-bottom:6px;user-select:none;}
.team-type-odd .row{background:rgba(45,12,12,.75);border-color:rgba(90,25,25,.8);}
.team-type-even .row{background:rgba(58,18,15,.75);border-color:rgba(110,38,32,.8);}
.row.selectable{cursor:pointer;}
.row.selected{border-color:var(--gold)!important;background:rgba(255,209,102,.2)!important;}
.row.eliminated{opacity:.45;filter:grayscale(85%);background:rgba(0,0,0,.4)!important;}
.row.advanced{background:rgba(46,204,113,.22)!important;border-color:var(--green)!important;}
.row-content{display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;width:100%;}
.meta{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;width:100%;}
.meta b{font-size:1.1rem;font-weight:800;color:var(--ink);}
.badge-box{background:linear-gradient(135deg,#ffcd3c,#f5a623);color:#000;padding:1px 6px;border-radius:6px;font-weight:800;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;}
.floating-popup{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,8,8,.98);border:1px solid var(--gold);box-shadow:0 6px 20px rgba(0,0,0,.6);padding:12px 20px;border-radius:14px;display:flex;align-items:center;gap:14px;z-index:1000;}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(500px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.6);}
dialog::backdrop{background:rgba(5,2,5,.8);}
dialog label{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;color:var(--muted);font-size:.85rem}
dialog input,dialog select{width:100%}
.empty{color:var(--muted);padding:12px 0;text-align:center;font-size:.85rem;}
.sm{padding:4px 10px;font-size:.8rem;border-radius:6px;}
.stage-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.stage-item input{flex:1;}
.header-actions{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;padding:0 8px;}
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBxUuFEAbrYW3PLnhYaHgSjwUIPvI2hMus",
    authDomain: "thevoice-e515f.firebaseapp.com",
    databaseURL: "https://thevoice-e515f-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "thevoice-e515f",
    storageBucket: "thevoice-e515f.firebasestorage.app",
    messagingSenderId: "52048471580",
    appId: "1:52048471580:web:24655f62b3897db1fd21d9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.handleAuthClick = function() {
    if (auth.currentUser) {
      signOut(auth).then(() => { showCustomAlert("Erfolgreich abgemeldet."); });
    } else {
      openLoginModal();
    }
  };

  window.executeEmailLogin = function() {
    const email = document.getElementById("login_email").value.trim();
    const pass = document.getElementById("login_pass").value.trim();
    if (!email || !pass) { showCustomAlert("Bitte E-Mail und Passwort eingeben."); return; }
    signInWithEmailAndPassword(auth, email, pass)
      .then(() => { dlg.close(); showCustomAlert("Erfolgreich angemeldet!"); })
      .catch((error) => { showCustomAlert("Login fehlgeschlagen: " + error.message); });
  };

  function openLoginModal() {
    dlg.innerHTML = '<h3>🔐 Admin Login</h3>' +
      '<p class="hint">E-Mail & Passwort eingeben.</p>' +
      '<label>E-Mail<input type="email" id="login_email" placeholder="admin@example.com"></label>' +
      '<label>Passwort<input type="password" id="login_pass" placeholder="••••••••"></label>' +
      '<div class="actions" style="margin-top:16px; justify-content:flex-end;">' +
        '<button class="ghost" data-act="closeDlg">Abbrechen</button>' +
        '<button class="primary" onclick="executeEmailLogin()">Einloggen</button>' +
      '</div>';
    if (!dlg.open) dlg.showModal();
  }

  onAuthStateChanged(auth, (user) => {
    const authBtn = document.getElementById("auth_btn");
    if (authBtn) {
      if (user) {
        authBtn.textContent = "🔓 Abmelden (" + user.email.split('@')[0] + ")";
        authBtn.className = "ghost sm";
      } else {
        authBtn.textContent = "🔐 Admin Login";
        authBtn.className = "primary sm";
      }
    }
  });
</script>

<body>
<div class="wrap">
  <header>
    <div class="brand" data-act="goHome">🎙️ THE VOICE</div>
    <div class="who">
      <button id="auth_btn" class="primary sm" onclick="handleAuthClick()">🔐 Admin Login</button>
      <span id="net" class="net"></span>
      <div id="header_tools" style="display:flex; gap:10px; align-items:center;"></div>
    </div>
  </header>
  <div id="app"></div>
</div>
<div id="floating_popup_container"></div>
<dialog id="dlg"></dialog>

<script>
var DB = "https://thevoice-e515f-default-rtdb.europe-west1.firebasedatabase.app".replace(/\/+$/,"");
var lastFlat = {}, busy = 0, net = DB ? "connecting" : "local";
var netText = function(){ return {local:"Lokal",connecting:"Verbindet…",online:"● Wolke (Cloud)",error:"Offline"}[net]; };
var badge = function(){ var n = $("#net"); if(n) n.textContent = netText(); };

var fresh = function() { return { seasons: [] }; };
var S = fresh();

var ui = { 
  view: "home", seasonId: null, tab: null, enter: false, 
  editTalent: null, editSeasonId: null, editMode: false,
  selectedTalents: [], mode: "fake", highlightTalentIds: [],
  stealModeActive: false, searchQuery: ""
};

var $ = function(s) { return document.querySelector(s); };
var esc = function(s) { return String(s ? s : "").replace(/[&<>"']/g, function(c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

function push(){
  if(!DB)return;
  var cur=flat(toTree()),p={};
  for(var k in cur)if(cur[k]!==lastFlat[k])p[k]=cur[k];
  for(var k in lastFlat)if(!(k in cur))p[k]=null;
  if(!Object.keys(p).length)return;
  var prev=lastFlat;lastFlat=cur;busy++;
  fetch(DB+"/.json",{method:"PATCH",body:JSON.stringify(p)}).then(function(r){if(!r.ok)throw 0;net="online";}).catch(function(){lastFlat=prev;net="error";}).finally(function(){busy--;badge();});
}

function pull(first){
  if(!DB||busy)return;
  fetch(DB+"/.json").then(function(res){return res.json();}).then(function(t){
    net="online";
    if(!t){if(first===true)push();badge();return;}
    var f=flat(t);
    if(same(f,lastFlat)){badge();return;}
    var a=document.activeElement;
    if(first!==true&&(dlg.open||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))))return;
    S=fromTree(t);lastFlat=f;
    render();
  }).catch(function(){net="error";badge();});
}

function save() { push(); }

function toTree() {
  var t = { seasons: {} };
  for(var i=0; i<S.seasons.length; i++){
    var s = S.seasons[i];
    var seasonsObj = { location: s.location, number: s.number, year: s.year, winner: s.winner, teamCount: s.teamCount, teams: {}, realTeams: {}, stages: {}, talents: {} };
    for(var j=0; j<s.teams.length; j++){ seasonsObj.teams[s.teams[j].id] = { name: s.teams[j].name }; }
    if (s.realTeams) {
      for(var j=0; j<s.realTeams.length; j++){ var rt = s.realTeams[j]; seasonsObj.realTeams[rt.id] = { name: rt.name, initial: rt.initial, color: rt.color || "#e62a2a" }; }
    }
    for(var j=0; j<s.stages.length; j++){ seasonsObj.stages[s.stages[j].id] = { name: s.stages[j].name }; }
    for(var j=0; j<s.talents.length; j++){
      var tal = s.talents[j];
      seasonsObj.talents[tal.id] = { stageId: tal.stageId, teamId: tal.teamId, name: tal.name, buzzers: tal.buzzers, realTeamId: tal.realTeamId || "", status: tal.status || "active", isAllStar: tal.isAllStar ? true : false, isSteal: tal.isSteal ? true : false };
    }
    t.seasons[s.id] = seasonsObj;
  }
  return t;
}

function flat(o,p,out){
  p=p||""; out=out||{};
  for(var k in o){
    var v=o[k],q=p?p+"/"+k:k;
    if(v&&typeof v==="object")flat(v,q,out);
    else if(v!==undefined&&v!==null&&v!=="")out[q]=v;
  }
  return out;
}

function fromTree(t) {
  var r = fresh();
  var tSeasons = t.seasons || {};
  for(var id in tSeasons){
    if(tSeasons.hasOwnProperty(id)){
      var o = tSeasons[id];
      var teams = []; if(o.teams){ for(var tid in o.teams){ teams.push({ id: tid, name: o.teams[tid].name }); } }
      var realTeams = []; if(o.realTeams){ for(var rtid in o.realTeams){ realTeams.push({ id: rtid, name: o.realTeams[rtid].name, initial: o.realTeams[rtid].initial, color: o.realTeams[rtid].color || "#e62a2a" }); } }
      var stages = []; if(o.stages){ for(var sid in o.stages){ stages.push({ id: sid, name: o.stages[sid].name }); } }
      var talents = []; if(o.talents){ for(var talid in o.talents){ var tal = o.talents[talid]; talents.push({ id: talid, stageId: tal.stageId, teamId: tal.teamId, name: tal.name, buzzers: tal.buzzers, realTeamId: tal.realTeamId || "", status: tal.status || "active", isAllStar: tal.isAllStar ? true : false, isSteal: tal.isSteal ? true : false }); } }
      r.seasons.push({ id: id, location: o.location || "Germany", number: o.number || 1, year: o.year || 2026, winner: o.winner || "TBD", teamCount: o.teamCount || 4, teams: teams.length ? teams : [{id:"t1",name:"Team 1"},{id:"t2",name:"Team 2"},{id:"t3",name:"Team 3"},{id:"t4",name:"Team 4"}], realTeams: realTeams, stages: stages.length ? stages : [{id:"s1",name:"Blind Auditions"}], talents: talents });
    }
  }
  r.seasons.sort(function(a,b){ return b.year - a.year; });
  return r;
}

function same(a,b){
  var k=Object.keys(a); if(k.length !== Object.keys(b).length) return false;
  for(var i=0; i<k.length; i++){ if(a[k[i]] !== b[k[i]]) return false; }
  return true;
}

function currentSeason() {
  if (!ui.seasonId) return null;
  return S.seasons.find(function(s){ return s.id === ui.seasonId; });
}

function createDefaultSeason(location, number, year, winner) {
  return {
    id: "season_" + Date.now(), location: location, number: number, year: year, winner: winner || "TBD", teamCount: 4,
    teams: [{id:"t1",name:"Team 1"},{id:"t2",name:"Team 2"},{id:"t3",name:"Team 3"},{id:"t4",name:"Team 4"}],
    realTeams: [{id:"rt1",name:"Team Shirin David",initial:"S",color:"#e62a2a"}],
    stages: [{id:"s1",name:"Blind Auditions"},{id:"s2",name:"Battles"}], talents: []
  };
}

var dlg = $("#dlg");
dlg.addEventListener("close", function() { render(); });

function showCustomAlert(msg) {
  dlg.innerHTML = '<h3>Hinweis</h3><p style="margin:14px 0;color:var(--ink);">' + esc(msg) + '</p><div class="actions" style="margin-top:16px;justify-content:flex-end;"><button class="primary" data-act="closeDlg">OK</button></div>';
  if (!dlg.open) dlg.showModal();
}

function render() {
  if (ui.enter) { var app = $("#app"); app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); }
  ui.enter = false; badge();
  var cs = currentSeason();

  if (ui.view === "home") {
    ui.editMode = false; ui.selectedTalents = []; ui.stealModeActive = false; ui.searchQuery = "";
    $("#header_tools").innerHTML = '';
    $("#app").innerHTML = homeView();
  } else if (ui.view === "season") {
    if (!cs) { ui.view = "home"; render(); return; }
    if (!ui.tab && cs.stages.length > 0) ui.tab = cs.stages[0].id;
    var editBtnClass = ui.editMode ? "primary" : "ghost";
    $("#header_tools").innerHTML = '<button class="'+editBtnClass+'" data-act="toggleEditMode">✏️ Edit Mode</button>';
    $("#app").innerHTML = seasonView(cs);
  }
}

function homeView() {
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;padding:0 8px;"><h1 class="hero" style="margin:20px 0">Alle Staffeln</h1><button class="primary" data-act="openSeasonModal">＋ Neue Staffel</button></div>';
  if (S.seasons.length === 0) return html + '<p class="empty" style="margin-top:30px;">Keine Staffeln vorhanden.</p>';
  var cardsHtml = '';
  for (var i = 0; i < S.seasons.length; i++) {
    var s = S.seasons[i];
    cardsHtml += '<div class="card season-card" data-act="openSeason" data-id="'+s.id+'"><div class="s-title">The Voice ' + esc(s.location) + '</div><div class="s-meta">Staffel ' + esc(s.number) + ' (' + esc(s.year) + ')</div></div>';
  }
  return html + '<div class="grid" style="padding:0 8px;">' + cardsHtml + '</div>';
}

function seasonView(cs) {
  var title = "The Voice " + esc(cs.location) + " - Staffel " + esc(cs.number);
  var tabsHtml = '';
  for (var i = 0; i < cs.stages.length; i++) {
    var st = cs.stages[i];
    tabsHtml += '<button class="'+(ui.tab === st.id ? "on" : "")+'" data-act="setTab" data-id="'+st.id+'">'+esc(st.name)+'</button>';
  }
  var html = '<div class="header-actions"><button class="ghost" data-act="goHome">← Zurück</button></div><h1 class="hero" style="margin:8px 8px 12px;">' + title + '</h1>';
  html += '<div class="stage-bar-wrap"><div class="tabs">' + tabsHtml + '</div></div>';
  
  var activeTeams = cs.teams.slice(0, cs.teamCount);
  var gridHtml = '';
  for (var i = 0; i < activeTeams.length; i++) {
    var team = activeTeams[i];
    var teamTalents = cs.talents.filter(function(t) { return t.stageId === ui.tab && t.teamId === team.id; });
    var talentsHtml = '';
    for (var j = 0; j < teamTalents.length; j++) {
      var t = teamTalents[j];
      talentsHtml += '<div class="row"><span>' + esc(t.buzzers) + '</span><div class="row-content"><div class="meta"><b>' + esc(t.name) + '</b></div></div></div>';
    }
    gridHtml += '<div class="card"><div class="team-header"><button class="ghost sm add-btn-left" data-act="addTalent" data-team="'+team.id+'">＋</button><h3>' + esc(team.name) + '</h3></div>' + talentsHtml + '</div>';
  }
  return html + '<div class="grid" style="padding:0 8px;">' + gridHtml + '</div>';
}

var A = {
  goHome: function() { ui.view = "home"; ui.seasonId = null; ui.enter = true; return "render"; },
  openSeason: function(el) { ui.seasonId = el.dataset.id; ui.view = "season"; ui.tab = null; ui.enter = true; return "render"; },
  closeDlg: function() { dlg.close(); return "keep"; },
  setTab: function(el) { ui.tab = el.dataset.id; ui.enter = true; },
  toggleEditMode: function() { ui.editMode = !ui.editMode; ui.enter = true; },
  openSeasonModal: function() {
    dlg.innerHTML = '<h3>Neue Staffel</h3><label>Land<input id="sea_loc" value="Germany"></label><label>Nummer<input type="number" id="sea_num" value="1"></label><div class="actions"><button class="ghost" data-act="closeDlg">Abbrechen</button><button class="primary" data-act="saveSeason">Speichern</button></div>';
    if (!dlg.open) dlg.showModal(); return "keep";
  },
  saveSeason: function() {
    S.seasons.push(createDefaultSeason($("#sea_loc").value, parseInt($("#sea_num").value), 2026));
    save(); dlg.close(); ui.enter = true; return "render";
  },
  addTalent: function(el) {
    dlg.innerHTML = '<h3>Neues Talent</h3><label>Name<input id="tal_name"></label><input type="hidden" id="tal_team" value="'+el.dataset.team+'"><div class="actions"><button class="ghost" data-act="closeDlg">Abbrechen</button><button class="primary" data-act="saveTalent">Speichern</button></div>';
    if (!dlg.open) dlg.showModal(); return "keep";
  },
  saveTalent: function() {
    var cs = currentSeason();
    if (!cs) return "keep";
    cs.talents.push({ id: "tal_" + Date.now(), stageId: ui.tab, teamId: $("#tal_team").value, name: $("#tal_name").value, buzzers: 1, status: "active" });
    save(); dlg.close(); ui.enter = true; return "render";
  }
};

document.addEventListener("click", function(ev) {
  var t = ev.target.closest("[data-act]"); if(!t || !A[t.dataset.act]) return;
  var r = A[t.dataset.act](t); if(r !== "keep") render();
});

pull(true);
setInterval(function(){ pull(); }, 4000);
</script>
</body>
