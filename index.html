<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;800&family=Outfit:wght@500;800&family=Plus+Jakarta+Sans:wght@500;700;800&family=Protest+Strike&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0505; --panel:#140808; --panel2:#1f0a0a; --line:#3d1414;
  --ink:#f8f5ff; --muted:#a99494; --red:#e62a2a; --gold:#ffd166; --green:#2ecc71;
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --number-font:"Protest Strike", sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;font-family:var(--body);color:var(--ink);background:
  radial-gradient(900px 420px at 50% -10%,rgba(230,42,42,.15),transparent 60%),
  radial-gradient(700px 380px at 10% 20%,rgba(255,209,102,.08),transparent 60%),var(--bg);
  min-height:100vh;line-height:1.42; overflow-x:hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: -1;
  background: 
    radial-gradient(900px 420px at 30% 10%, rgba(230,42,42,.12), transparent 60%),
    radial-gradient(800px 400px at 80% 70%, rgba(255,209,102,.05), transparent 60%);
  animation: bgFloat 14s ease-in-out infinite alternate;
}
@keyframes bgFloat {
  0% { transform: translateY(0px) scale(1); }
  50% { transform: translateY(-25px) scale(1.04); }
  100% { transform: translateY(20px) scale(0.97); }
}

#app { transition: opacity 0.3s ease; }
#app.enter { animation: popIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
@keyframes popIn {
  0% { opacity: 0; transform: translateY(10px) scale(0.99); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.wrap{max-width:100%;margin:0 auto;padding:0 24px 100px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.01em; color:var(--red); cursor:pointer;}
.who{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}
.net{font-size:.8rem}

select,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%; transition: border-color 0.2s ease;}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

button{
  font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 12px;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,filter .2s ease,background-color .2s ease,opacity .2s ease,border-color .2s ease;
}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(230,42,42,.25)}
button:active:not(:disabled){transform:scale(.92);box-shadow:none}

button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
button.ghost{background:transparent}
button.danger{color:#ffb3b3}
button:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}

.hero{
  font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,6vw,4rem);line-height:1.05;margin:32px 0 16px;letter-spacing:-.02em;
  background:linear-gradient(135deg, #ff4d4d 0%, #e62a2a 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

h2{font-family:var(--display);font-size:1.5rem;margin:0}
h3{font-family:var(--display);margin:0 0 12px}
.hint{color:var(--muted);margin:0 0 14px;font-size:.9rem}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(0, 1fr));gap:12px;margin-top:20px; align-items:start;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card.team-type-odd { background: linear-gradient(140deg, rgba(28, 8, 8, 0.95), rgba(16, 4, 4, 0.95)); border-color: rgba(230, 42, 42, 0.45); }
.card.team-type-even { background: linear-gradient(140deg, rgba(36, 12, 10, 0.95), rgba(20, 6, 5, 0.95)); border-color: rgba(255, 107, 107, 0.35); }

.season-card { cursor:pointer; display:flex; flex-direction:column; gap:8px; padding:24px; min-height:140px; justify-content:center; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease, border-color 0.25s ease;}
.season-card:hover { transform:translateY(-6px); box-shadow:0 12px 24px rgba(0,0,0,0.4); border-color:var(--red); }
.season-card:active { transform:scale(0.96); }
.season-card .s-title { font-family:var(--display); font-size:1.8rem; font-weight:800; color:var(--ink); line-height:1.1; }
.season-card .s-meta { color:var(--muted); font-size:0.95rem; }
.season-card .s-winner { margin-top:8px; display:inline-block; padding:4px 8px; background:rgba(255,209,102,0.1); color:var(--gold); border:1px solid rgba(255,209,102,0.3); border-radius:6px; font-weight:700; font-size:0.85rem;}

.team-header { 
  position: relative;
  padding-bottom: 8px; 
  border-bottom: 1px solid var(--line); 
  margin-bottom: 8px; 
  display: flex; 
  align-items: center;
  justify-content: center;
  min-height: 32px;
}
.team-header h3 { margin: 0; font-size: 1.2rem; color: var(--gold); text-align: center; }
.team-header .add-btn-left {
  position: absolute;
  left: 0;
  opacity: 0;
  transition: opacity 0.2s ease;
  padding: 2px 6px;
  font-size: 0.8rem;
}
.card:hover .team-header .add-btn-left {
  opacity: 1;
}
.team-header .talent-count-right {
  position: absolute;
  right: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  font-weight: 700;
}

.stage-bar-wrap {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0 0 16px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tabs button{border-radius:999px;background:transparent}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

.view-switch-container {
  display: flex;
  justify-content: center;
  margin: 16px 0 24px;
}
.view-switch {
  display: inline-flex;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
  position: relative;
}
.view-switch button {
  background: transparent;
  border: none;
  border-radius: 999px;
  padding: 8px 20px;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--muted);
  box-shadow: none !important;
  transform: none !important;
}
.view-switch button.active {
  background: var(--red);
  color: #fff;
  font-weight: 700;
}

@keyframes simpleFadeUp { 
  from { opacity: 0; transform: translateY(8px); } 
  to { opacity: 1; transform: translateY(0); } 
}

.row{
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  align-items: center;
  animation: simpleFadeUp 0.3s ease-out backwards;
  margin-bottom: 5px;
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  user-select: none; /* Verhindert das blaue Markieren von Text */
}

.team-type-odd .row { background: rgba(45, 12, 12, 0.7); border-color: rgba(90, 25, 25, 0.8); }
.team-type-even .row { background: rgba(58, 18, 15, 0.7); border-color: rgba(110, 38, 32, 0.8); }

.row.selectable { cursor: pointer; }
.row.selectable:hover { border-color: var(--gold); }
.row.selectable:active { transform: scale(0.97); } /* Haptischer Klick-Effekt */
.row.selected { border-color: var(--gold); background: rgba(255, 209, 102, 0.15) !important; }

.row.eliminated { opacity: 0.5; filter: grayscale(80%); background: rgba(0,0,0,0.3) !important; }
.row.eliminated .meta b { text-decoration: line-through; color: var(--muted); }

.row.advanced { 
  background: rgba(46, 204, 113, 0.18) !important; 
  border-color: var(--green) !important; 
}

/* 3 Sekunden Animation für das Highlight nach dem Speichern */
@keyframes highlightPulse {
  0% { transform: scale(1); box-shadow: 0 0 0px var(--gold); }
  25% { transform: scale(1.03); box-shadow: 0 0 18px var(--gold); border-color: var(--gold); }
  75% { transform: scale(1.03); box-shadow: 0 0 18px var(--gold); border-color: var(--gold); }
  100% { transform: scale(1); box-shadow: 0 0 0px var(--gold); }
}
.row.recently-updated {
  animation: highlightPulse 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

.row-content{ display:flex; flex-direction:column; gap:2px; align-items:center; justify-content:center; width:100%; pointer-events: none; }
.meta{ display:flex; align-items: center; justify-content: center; gap: 6px; text-align: center; width: 100%; }
.meta b{font-size:1.1rem; font-weight: 800; font-family: var(--body); color: var(--ink); line-height: 1.2;}

.badge-box {
  background: linear-gradient(135deg, #ffcd3c, #f5a623);
  color: #000;
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 800;
  font-size: 0.95rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Jost', sans-serif;
  min-width: 26px;
  height: 26px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  border: 1px solid rgba(0,0,0,0.15);
  line-height: 1;
  pointer-events: none;
}

.ace-symbol {
  font-size: 1.5rem;
  color: var(--gold);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  line-height: 1;
  text-shadow: 0 0 12px rgba(255, 209, 102, 0.6);
  pointer-events: none;
}

.floating-popup {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: transparent;
  border: none;
  box-shadow: none;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 1000;
  animation: slideUpPopup 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes slideUpPopup {
  from { opacity: 0; transform: translate(-50%, 20px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

dialog{
  background:var(--panel);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px;
  width:min(520px,92vw);
  animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
dialog::backdrop{background:rgba(5,2,5,.85);backdrop-filter:blur(4px);animation:fadeIn .25s ease}
@keyframes scaleUp {
  from { opacity: 0; transform: scale(0.92) translateY(16px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

dialog label{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;color:var(--muted);font-size:.9rem}
dialog input,dialog select{width:100%}

.empty{color:var(--muted);padding:15px 0; text-align: center; font-size: 0.9rem;}
.sm{padding:2px 6px;font-size:0.7rem}
.stage-item { display:flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.stage-item input { flex: 1; }

.header-actions { display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }

/* Animierte Ergebnis-Karten im Popup */
@keyframes resultCardPop {
  0% { opacity: 0; transform: scale(0.8) translateY(15px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.anim-result-card {
  animation: resultCardPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" data-act="goHome">🎙️ THE VOICE</div>
    <div class="who">
      <span id="net" class="net"></span>
      <div id="header_tools"></div>
    </div>
  </header>
  <div id="app"></div>
</div>
<div id="floating_popup_container"></div>
<dialog id="dlg"></dialog>

<script>
var DB = "https://thevoice-e515f-default-rtdb.europe-west1.firebasedatabase.app".replace(/\/+$/,"");
var lastFlat = {}, busy = 0, net = DB ? "connecting" : "local";
var netText = function(){ return {local:"Lokal",connecting:"Verbindet…",online:"● Geteilt",error:"Offline"}[net]; };
var badge = function(){ var n = $("#net"); if(n) n.textContent = netText(); };

var fresh = function() {
  return { seasons: [] };
};

var S = fresh();

var ui = { 
  view: "home", 
  seasonId: null, 
  tab: null, 
  enter: false, 
  editTalent: null,
  editSeasonId: null,
  editMode: false,
  selectedTalents: [],
  mode: "fake",
  highlightTalentIds: []
};

var $ = function(s) { return document.querySelector(s); };
var esc = function(s) { return String(s ? s : "").replace(/[&<>"']/g, function(c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

function save() {
  try { localStorage.setItem("voice-setup-db", JSON.stringify(S)); } catch(e) {}
  push();
}

function toTree() {
  var t = { seasons: {} };
  for(var i=0; i<S.seasons.length; i++){
    var s = S.seasons[i];
    var seasonsObj = {
      location: s.location,
      number: s.number,
      year: s.year,
      winner: s.winner,
      teamCount: s.teamCount,
      teams: {},
      realTeams: {},
      stages: {},
      talents: {}
    };
    for(var j=0; j<s.teams.length; j++){
      seasonsObj.teams[s.teams[j].id] = { name: s.teams[j].name };
    }
    if (s.realTeams) {
      for(var j=0; j<s.realTeams.length; j++){
        var rt = s.realTeams[j];
        seasonsObj.realTeams[rt.id] = { name: rt.name, initial: rt.initial, color: rt.color || "#e62a2a" };
      }
    }
    for(var j=0; j<s.stages.length; j++){
      seasonsObj.stages[s.stages[j].id] = { name: s.stages[j].name };
    }
    for(var j=0; j<s.talents.length; j++){
      var tal = s.talents[j];
      seasonsObj.talents[tal.id] = {
        stageId: tal.stageId,
        teamId: tal.teamId,
        name: tal.name,
        buzzers: tal.buzzers,
        realTeamId: tal.realTeamId || "",
        status: tal.status || "active",
        isAllStar: tal.isAllStar ? true : false,
        isSteal: tal.isSteal ? true : false
      };
    }
    t.seasons[s.id] = seasonsObj;
  }
  return t;
}

function flat(o,p,out){
  p=p||""; out=out||{};
  for(var k in o){
    var v=o[k],q=p?p+"/"+k:k;
    if(v&&typeof v==="object")flat(v,q,out);
    else if(v!==undefined&&v!==null&&v!=="")out[q]=v;
  }
  return out;
}

function fromTree(t) {
  var r = fresh();
  var tSeasons = t.seasons || {};
  for(var id in tSeasons){
    if(tSeasons.hasOwnProperty(id)){
      var o = tSeasons[id];
      var teams = [];
      if(o.teams){
        for(var tid in o.teams){
          teams.push({ id: tid, name: o.teams[tid].name });
        }
      }
      var realTeams = [];
      if(o.realTeams){
        for(var rtid in o.realTeams){
          realTeams.push({ id: rtid, name: o.realTeams[rtid].name, initial: o.realTeams[rtid].initial, color: o.realTeams[rtid].color || "#e62a2a" });
        }
      }
      var stages = [];
      if(o.stages){
        for(var sid in o.stages){
          stages.push({ id: sid, name: o.stages[sid].name });
        }
      }
      var talents = [];
      if(o.talents){
        for(var talid in o.talents){
          var tal = o.talents[talid];
          talents.push({
            id: talid,
            stageId: tal.stageId,
            teamId: tal.teamId,
            name: tal.name,
            buzzers: tal.buzzers,
            realTeamId: tal.realTeamId || "",
            status: tal.status || "active",
            isAllStar: tal.isAllStar ? true : false,
            isSteal: tal.isSteal ? true : false
          });
        }
      }
      r.seasons.push({
        id: id,
        location: o.location || "Germany",
        number: o.number || 1,
        year: o.year || 2026,
        winner: o.winner || "TBD",
        teamCount: o.teamCount || 4,
        teams: teams.length ? teams : [{id: "t1", name: "Team 1"}, {id: "t2", name: "Team 2"}, {id: "t3", name: "Team 3"}, {id: "t4", name: "Team 4"}],
        realTeams: realTeams,
        stages: stages.length ? stages : [{id: "s1", name: "Blind Auditions"}, {id: "s2", name: "Battles"}],
        talents: talents
      });
    }
  }
  r.seasons.sort(function(a,b){ return b.year - a.year; });
  return r;
}

function same(a,b){
  var k=Object.keys(a); if(k.length !== Object.keys(b).length) return false;
  for(var i=0; i<k.length; i++){ if(a[k[i]] !== b[k[i]]) return false; }
  return true;
}

function push(){
  if(!DB)return;
  var cur=flat(toTree()),p={};
  for(var k in cur)if(cur[k]!==lastFlat[k])p[k]=cur[k];
  for(var k in lastFlat)if(!(k in cur))p[k]=null;
  if(!Object.keys(p).length)return;
  var prev=lastFlat;lastFlat=cur;busy++;
  fetch(DB+"/.json",{method:"PATCH",body:JSON.stringify(p)}).then(function(r){if(!r.ok)throw 0;net="online";}).catch(function(){lastFlat=prev;net="error";}).finally(function(){busy--;badge();});
}

function pull(first){
  if(!DB||busy)return;
  fetch(DB+"/.json").then(function(res){return res.json();}).then(function(t){
    net="online";
    if(!t){if(first===true)push();badge();return;}
    var f=flat(t);
    if(same(f,lastFlat)){badge();return;}
    var a=document.activeElement;
    if(first!==true&&(dlg.open||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))))return;
    S=fromTree(t);lastFlat=f;
    try{localStorage.setItem("voice-setup-db",JSON.stringify(S));}catch(e){}
    render();
  }).catch(function(){net="error";badge();});
}

try {
  var localData = JSON.parse(localStorage.getItem("voice-setup-db"));
  if (localData && localData.seasons) S = localData;
} catch(e) {}

function currentSeason() {
  if (!ui.seasonId) return null;
  return S.seasons.find(function(s){ return s.id === ui.seasonId; });
}

function createDefaultSeason(location, number, year, winner) {
  return {
    id: "season_" + Date.now(),
    location: location,
    number: number,
    year: year,
    winner: winner || "TBD",
    teamCount: 4,
    teams: [
      {id: "t1", name: "Team 1"},
      {id: "t2", name: "Team 2"},
      {id: "t3", name: "Team 3"},
      {id: "t4", name: "Team 4"}
    ],
    realTeams: [
      {id: "rt1", name: "Team Shirin David", initial: "S", color: "#e62a2a"},
      {id: "rt2", name: "Team Mark Forster", initial: "M", color: "#ffd166"}
    ],
    stages: [
      {id: "s1", name: "Blind Auditions"},
      {id: "s2", name: "Battles"}
    ],
    talents: []
  };
}

var dlg = $("#dlg");
dlg.addEventListener("close", function() { render(); });

function showCustomAlert(msg) {
  dlg.innerHTML = '<h3>Hinweis</h3>' +
    '<p style="margin: 16px 0; color: var(--ink);">' + esc(msg) + '</p>' +
    '<div class="actions" style="margin-top:20px; justify-content:flex-end;">' +
      '<button class="primary" data-act="closeDlg">OK</button>' +
    '</div>';
  if (!dlg.open) dlg.showModal();
}

function showCustomConfirm(msg, onConfirm) {
  dlg.innerHTML = '<h3>Bestätigung</h3>' +
    '<p style="margin: 16px 0; color: var(--ink);">' + esc(msg) + '</p>' +
    '<div class="actions" style="margin-top:20px; justify-content:flex-end;">' +
      '<button class="ghost" data-act="closeDlg">Abbrechen</button>' +
      '<button class="primary" id="dlg_confirm_btn">Bestätigen</button>' +
    '</div>';
  if (!dlg.open) dlg.showModal();
  setTimeout(function(){
    var btn = $("#dlg_confirm_btn");
    if (btn) {
      btn.onclick = function() {
        dlg.close();
        onConfirm();
      };
    }
  }, 50);
}

function render() {
  if (ui.enter) {
    var app = $("#app");
    app.classList.remove("enter"); 
    void app.offsetWidth; 
    app.classList.add("enter");
  }
  ui.enter = false;
  badge();
  
  var floatingContainer = $("#floating_popup_container");
  var cs = currentSeason();
  var currentStageIdx = (cs && ui.tab) ? cs.stages.findIndex(function(st){ return st.id === ui.tab; }) : -1;

  if (ui.view === "home") {
    ui.editMode = false;
    ui.selectedTalents = [];
    $("#header_tools").innerHTML = '';
    $("#app").innerHTML = homeView();
    if (floatingContainer) floatingContainer.innerHTML = '';
  } else if (ui.view === "season") {
    if (!cs) { ui.view = "home"; render(); return; }
    if (!ui.tab && cs.stages.length > 0) ui.tab = cs.stages[0].id;
    
    var editBtnClass = ui.editMode ? "primary" : "ghost";
    var stealHeaderBtn = currentStageIdx > 0 ? '<button class="ghost" data-act="openStealModal" style="border-color:var(--gold); color:var(--gold);">🔄 Steal-Deal</button>' : '';
    
    $("#header_tools").innerHTML = stealHeaderBtn +
                                   '<button class="'+editBtnClass+'" data-act="toggleEditMode">✏️ Edit Mode</button>' +
                                   '<button class="ghost" data-act="openSettings" style="border-color:var(--line)">⚙️ Einstellungen</button>';
    $("#app").innerHTML = seasonView(cs);

    if (currentStageIdx > 0 && ui.selectedTalents.length > 0) {
      floatingContainer.innerHTML = '<div class="floating-popup">' +
                '<span style="background:var(--panel); border:1px solid var(--line); padding:8px 14px; border-radius:8px; font-size:0.9rem;"><b>' + ui.selectedTalents.length + '</b> Talente ausgewählt</span>' +
                '<button class="ghost sm" style="background:var(--panel); border-color:var(--line);" data-act="clearSelection">Auswahl aufheben</button>' +
                '<button class="primary sm" data-act="openBattleModal">⚔️ Battle / Entscheidung durchführen</button>' +
              '</div>';
    } else {
      if (floatingContainer) floatingContainer.innerHTML = '';
    }
  }
}

function homeView() {
  var html = '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">' +
             '<h1 class="hero" style="margin:24px 0">Alle Staffeln</h1>' +
             '<button class="primary" data-act="openSeasonModal" style="font-size:1.1rem; padding:10px 20px">＋ Neue Staffel</button>' +
             '</div>';
  
  if (S.seasons.length === 0) {
    html += '<p class="empty" style="font-size:1.1rem; margin-top:40px;">Noch keine Staffeln angelegt. Klicke auf "Neue Staffel", um zu beginnen.</p>';
    return html;
  }

  var sortedSeasons = S.seasons.slice().sort(function(a,b){ return b.year - a.year; });
  
  var cardsHtml = '';
  for (var i = 0; i < sortedSeasons.length; i++) {
    var s = sortedSeasons[i];
    var title = "The Voice " + esc(s.location);
    var meta = "Staffel " + esc(s.number) + " (" + esc(s.year) + ")";
    var winnerLabel = s.winner && s.winner !== "TBD" ? "🏆 Gewinner: " + esc(s.winner) : "Gewinner: TBD";
    
    cardsHtml += 
      '<div class="card season-card" data-act="openSeason" data-id="'+s.id+'">' +
        '<div class="s-title">' + title + '</div>' +
        '<div class="s-meta">' + meta + '</div>' +
        '<div><span class="s-winner">' + winnerLabel + '</span></div>' +
      '</div>';
  }

  html += '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));">' + cardsHtml + '</div>';
  return html;
}

function seasonView(cs) {
  var title = "The Voice " + esc(cs.location) + " - Staffel " + esc(cs.number) + " (" + esc(cs.year) + ")";
  
  var html = '<div class="header-actions">' +
               '<button class="ghost" data-act="goHome">← Alle Staffeln</button>' +
               '<button class="ghost" data-act="openSeasonModal" data-id="'+cs.id+'">✏️ Staffel bearbeiten</button>' +
               '<button class="ghost danger" data-act="delSeason" data-id="'+cs.id+'">🗑️ Löschen</button>' +
             '</div>' +
             '<h1 class="hero" style="margin:10px 0 16px; font-size:clamp(2rem,5vw,3rem);">' + title + '</h1>';
             
  if (cs.winner && cs.winner !== "TBD") {
    html += '<p style="color:var(--gold); font-weight:700; font-size:1.1rem; margin-top:0;">🏆 Gewinner: ' + esc(cs.winner) + '</p>';
  }

  if (cs.stages.length > 0) {
    var tabsHtml = '';
    for (var i = 0; i < cs.stages.length; i++) {
      var st = cs.stages[i];
      var isOn = ui.tab === st.id ? "on" : "";
      tabsHtml += '<button class="'+isOn+'" data-act="setTab" data-id="'+st.id+'">'+esc(st.name)+'</button>';
    }
    html += '<div class="stage-bar-wrap">' +
              '<div class="tabs" style="margin-top:0;">' + tabsHtml + '</div>' +
              '<button class="ghost sm" data-act="openCoachStatsModal" style="border-color:var(--line); padding:6px 12px; font-size:0.85rem;">📊 Statistik pro reales Team</button>' +
            '</div>';
  } else {
    html += '<p class="empty">Keine Abschnitte vorhanden. Gehe in die Einstellungen.</p>';
    return html;
  }

  var isFake = ui.mode === "fake";
  html += '<div class="view-switch-container">' +
            '<div class="view-switch">' +
              '<button class="' + (isFake ? 'active' : '') + '" data-act="setViewMode" data-mode="fake">🎭 Fake-Teams</button>' +
              '<button class="' + (!isFake ? 'active' : '') + '" data-act="setViewMode" data-mode="real">🎤 Real Teams</button>' +
            '</div>' +
          '</div>';

  var currentStageIdx = cs.stages.findIndex(function(st){ return st.id === ui.tab; });

  function getFilteredStageTalents() {
    var stageTalents = cs.talents.filter(function(t) { return t.stageId === ui.tab; });
    if (currentStageIdx >= 2) {
      var prevStageId = cs.stages[currentStageIdx - 1].id;
      
      var prevAdvancedNames = cs.talents
        .filter(function(t) { return t.stageId === prevStageId && (t.status === 'advanced' || t.isSteal); })
        .map(function(t) { return t.name.toLowerCase(); });
      
      return stageTalents.filter(function(t) {
        return prevAdvancedNames.includes(t.name.toLowerCase());
      });
    }
    return stageTalents;
  }

  var activeStageTalents = getFilteredStageTalents();
  var gridHtml = '';

  if (isFake) {
    var activeTeams = cs.teams.slice(0, cs.teamCount);
    for (var i = 0; i < activeTeams.length; i++) {
      var team = activeTeams[i];
      var teamTalents = activeStageTalents.filter(function(t) { return t.teamId === team.id; });
      var advCount = teamTalents.filter(function(t){ return t.status === 'advanced'; }).length;
      var elimCount = teamTalents.filter(function(t){ return t.status === 'eliminated'; }).length;

      var talentsHtml = '';
      for (var j = 0; j < teamTalents.length; j++) {
        var t = teamTalents[j];
        
        var initialBadge = '';
        if (cs.realTeams) {
          var rt = cs.realTeams.find(function(x){ return x.id === t.realTeamId; });
          if (rt && rt.initial) {
            var tooltipAttr = rt.name ? ' title="Realer Coach: ' + esc(rt.name) + '"' : '';
            var boxColor = rt.color || '#e62a2a';
            initialBadge = '<span class="badge-box" style="background:' + boxColor + '; color:#000;"' + tooltipAttr + '>' + esc(rt.initial) + '</span>';
          }
        }

        var buzzerBadge = '';
        if (cs.teamCount && t.buzzers === cs.teamCount) {
          buzzerBadge = '<span class="ace-symbol" title="Alle ' + cs.teamCount + ' Buzzer (Pik As)">♠</span>';
        } else {
          buzzerBadge = '<span class="badge-box" title="Buzzer">' + esc(t.buzzers) + '</span>';
        }

        var allStarStar = t.isAllStar ? '<span style="color:var(--gold); font-size:1.1rem; margin-right:2px;" title="All-Star (Kehrt zurück)">⭐</span>' : '';
        var stealBadge = t.isSteal ? '<span style="color:var(--gold); font-size:0.8rem; margin-left:6px; padding:2px 6px; background:rgba(255,209,102,0.15); border-radius:4px;" title="Steal-Deal Talent">🔄 Steal</span>' : '';

        var statusClass = '';
        if (t.status === 'eliminated') statusClass = 'eliminated';
        else if (t.status === 'advanced') statusClass = 'advanced';

        if (ui.highlightTalentIds && ui.highlightTalentIds.includes(t.id)) {
          statusClass += ' recently-updated';
        }

        var isSelectable = currentStageIdx > 0;
        var isSelected = ui.selectedTalents.includes(t.id);
        if (isSelectable) statusClass += ' selectable';
        if (isSelected) statusClass += ' selected';

        var editButtonsHtml = '';
        if (ui.editMode) {
          editButtonsHtml = '<div style="display:flex;gap:4px;margin-top:2px;justify-content:center;">' +
                              '<button class="ghost sm" data-act="editTalent" data-id="'+t.id+'">✏️ Edit</button>' +
                              '<button class="ghost sm danger" data-act="delTalent" data-id="'+t.id+'">Löschen</button>' +
                            '</div>';
        }

        var rowActionAttr = isSelectable ? 'data-act="toggleSelectTalent" data-id="'+t.id+'"' : '';

        talentsHtml += 
          '<div class="row ' + statusClass + '" id="row_talent_' + t.id + '" ' + rowActionAttr + '>' +
            buzzerBadge +
            '<div class="row-content">' +
              '<div class="meta">' +
                allStarStar + '<b>' + esc(t.name) + '</b>' + stealBadge +
              '</div>' +
              editButtonsHtml +
            '</div>' +
            '<div>' + initialBadge + '</div>' +
          '</div>';
      }

      if (teamTalents.length === 0) {
        talentsHtml = '<div class="empty" style="padding:10px 0">Keine Talente in diesem Team</div>';
      }

      var addBtnHtml = '';
      if (currentStageIdx === 0) {
        addBtnHtml = '<button class="ghost sm add-btn-left" data-act="addTalent" data-team="'+team.id+'" title="Talent hinzufügen">＋</button>';
      }

      var statsBadgeHtml = '';
      if (currentStageIdx > 0) {
        statsBadgeHtml = '<span style="color:var(--muted)">' + teamTalents.length + '</span>' +
                         '<span style="color:var(--green);" title="Weiter">🟢 ' + advCount + '</span>' +
                         '<span style="color:var(--red);" title="Raus">🔴 ' + elimCount + '</span>';
      } else {
        statsBadgeHtml = '<span style="color:var(--muted)">' + teamTalents.length + ' Talente</span>';
      }

      var teamTypeClass = (i % 2 === 0) ? 'team-type-odd' : 'team-type-even';

      gridHtml += 
        '<div class="card ' + teamTypeClass + '">' +
          '<div class="team-header">' +
            addBtnHtml +
            '<h3>' + esc(team.name) + '</h3>' +
            '<div class="talent-count-right">' + statsBadgeHtml + '</div>' +
          '</div>' +
          '<div class="list" style="margin-bottom:4px;">' + talentsHtml + '</div>' +
        '</div>';
    }
  } else {
    var realTeamsList = cs.realTeams || [];
    for (var i = 0; i < realTeamsList.length; i++) {
      var rt = realTeamsList[i];
      var rtTalents = activeStageTalents.filter(function(t) { return t.realTeamId === rt.id; });
      var advCount = rtTalents.filter(function(t){ return t.status === 'advanced'; }).length;
      var elimCount = rtTalents.filter(function(t){ return t.status === 'eliminated'; }).length;

      var talentsHtml = '';
      for (var j = 0; j < rtTalents.length; j++) {
        var t = rtTalents[j];
        
        var fakeTeamObj = cs.teams.find(function(tm){ return tm.id === t.teamId; }) || {};
        var fakeTeamBadge = '<span class="badge-box" style="background:var(--panel2); border:1px solid var(--line); color:var(--ink);" title="Fake-Team: ' + esc(fakeTeamObj.name || '') + '">' + esc(fakeTeamObj.name ? fakeTeamObj.name.replace("Team ", "T") : "T") + '</span>';

        var buzzerBadge = '';
        if (cs.teamCount && t.buzzers === cs.teamCount) {
          buzzerBadge = '<span class="ace-symbol" title="Alle ' + cs.teamCount + ' Buzzer (Pik As)">♠</span>';
        } else {
          buzzerBadge = '<span class="badge-box" title="Buzzer">' + esc(t.buzzers) + '</span>';
        }

        var allStarStar = t.isAllStar ? '<span style="color:var(--gold); font-size:1.1rem; margin-right:2px;" title="All-Star (Kehrt zurück)">⭐</span>' : '';
        var stealBadge = t.isSteal ? '<span style="color:var(--gold); font-size:0.8rem; margin-left:6px; padding:2px 6px; background:rgba(255,209,102,0.15); border-radius:4px;" title="Steal-Deal Talent">🔄 Steal</span>' : '';

        var statusClass = '';
        if (t.status === 'eliminated') statusClass = 'eliminated';
        else if (t.status === 'advanced') statusClass = 'advanced';

        if (ui.highlightTalentIds && ui.highlightTalentIds.includes(t.id)) {
          statusClass += ' recently-updated';
        }

        var isSelectable = currentStageIdx > 0;
        var isSelected = ui.selectedTalents.includes(t.id);
        if (isSelectable) statusClass += ' selectable';
        if (isSelected) statusClass += ' selected';

        var rowActionAttr = isSelectable ? 'data-act="toggleSelectTalent" data-id="'+t.id+'"' : '';

        talentsHtml += 
          '<div class="row ' + statusClass + '" id="row_talent_' + t.id + '" ' + rowActionAttr + '>' +
            buzzerBadge +
            '<div class="row-content">' +
              '<div class="meta">' +
                allStarStar + '<b>' + esc(t.name) + '</b>' + stealBadge +
              '</div>' +
            '</div>' +
            '<div>' + fakeTeamBadge + '</div>' +
          '</div>';
      }

      if (rtTalents.length === 0) {
        talentsHtml = '<div class="empty" style="padding:10px 0">Keine Talente in diesem Team</div>';
      }

      var statsBadgeHtml = '<span style="color:var(--muted)">' + rtTalents.length + '</span>' +
                           '<span style="color:var(--green);" title="Weiter">🟢 ' + advCount + '</span>' +
                           '<span style="color:var(--red);" title="Raus">🔴 ' + elimCount + '</span>';

      var teamTypeClass = (i % 2 === 0) ? 'team-type-odd' : 'team-type-even';

      gridHtml += 
        '<div class="card ' + teamTypeClass + '" style="border-color:' + (rt.color || 'var(--line)') + '">' +
          '<div class="team-header">' +
            '<h3 style="color:' + (rt.color || 'var(--gold)') + '">' + esc(rt.name) + ' (' + esc(rt.initial) + ')</h3>' +
            '<div class="talent-count-right">' + statsBadgeHtml + '</div>' +
          '</div>' +
          '<div class="list" style="margin-bottom:4px;">' + talentsHtml + '</div>' +
        '</div>';
    }

    if (realTeamsList.length === 0) {
      gridHtml = '<p class="empty">Keine realen Teams in den Einstellungen definiert.</p>';
    }
  }

  html += '<div class="grid">' + gridHtml + '</div>';
  return html;
}

function syncSettingsFromDOM() {
  var cs = currentSeason();
  if (!cs) return;
  var tcSel = $("#set_tc");
  if (tcSel) cs.teamCount = parseInt(tcSel.value) || 4;
  for(var i = 0; i < 5; i++) {
    var inp = $("#tname_" + i);
    if(inp && cs.teams[i]) cs.teams[i].name = inp.value.trim() || ("Team " + (i+1));
  }
  var rtItems = document.querySelectorAll("#real_teams_container .stage-item");
  var updatedRealTeams = [];
  for(var i = 0; i < rtItems.length; i++) {
    var nameInp = rtItems[i].querySelector(".rt-name");
    var initInp = rtItems[i].querySelector(".rt-init");
    var colorInp = rtItems[i].querySelector(".rt-color");
    if(nameInp) {
      var rtid = rtItems[i].dataset.rtid || ("rt_" + Date.now() + "_" + i);
      updatedRealTeams.push({ 
        id: rtid, 
        name: nameInp.value.trim(), 
        initial: initInp ? initInp.value.trim() : "",
        color: colorInp ? colorInp.value : "#e62a2a"
      });
    }
  }
  cs.realTeams = updatedRealTeams;

  for(var i = 0; i < cs.stages.length; i++) {
    var inp = $("#stname_" + cs.stages[i].id);
    if(inp) cs.stages[i].name = inp.value.trim() || "Unbenannt";
  }
}

  }

  var realTeamsHtml = '';

  for(var i = 0; i < cs.realTeams.length; i++) {

    var rtColor = rt.color || "#e62a2a";
    realTeamsHtml += '<div class="stage-item" data-rtid="'+rt.id+'">' +
      '<input type="color" class="rt-color" value="'+rtColor+'" title="Farbe wählen" style="width:42px; height:38px; padding:2px; cursor:pointer;">' +
      '<input type="text" class="rt-name" value="'+esc(rt.name)+'" placeholder="Reales Team (z.B. Team Shirin)">' +
      '<input type="text" class="rt-init" value="'+esc(rt.initial)+'" placeholder="Kürzel" maxlength="3" style="width:70px">' +

  for(var i = 0; i < cs.stages.length; i++) {
    var st = cs.stages[i];
    stagesHtml += '<div class="stage-item">' +
      '<input type="text" id="stname_'+st.id+'" value="'+esc(st.name)+'">' +
      '<button class="ghost danger" data-act="delStage" data-id="'+st.id+'">✕</button>' +

    '<hr style="border:0;border-bottom:1px solid var(--line);margin:16px 0">' +
    '<h3>Fake-Teams</h3>' +
    '<label>Anzahl der Teams<select id="set_tc" data-chg="teamCount">' + tcOpts + '</select></label>' +
    '<div id="team_names_container">' + teamsHtml + '</div>' +
    
    '<hr style="border:0;border-bottom:1px solid var(--line);margin:24px 0 16px">' +
    '<h3>Reale Teams / Coaches (Vorlagen)</h3>' +
    '<div id="real_teams_container">' + realTeamsHtml + '</div>' +
    '<button class="ghost" data-act="addRealTeam">＋ Reales Team hinzufügen</button>' +

    '<hr style="border:0;border-bottom:1px solid var(--line);margin:24px 0 16px">' +
    '<h3>Abschnitte (Stages)</h3>' +
    '<div id="stages_container">' + stagesHtml + '</div>' +
    '<button class="ghost" data-act="addStage">＋ Abschnitt hinzufügen</button>' +

    '<hr style="border:0;border-bottom:1px solid var(--line);margin:24px 0 16px">' +
    '<h3>Daten Export & Import (Backup)</h3>' +
    '<div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">' +
      '<button class="ghost" data-act="exportJSON" style="border-color:var(--line);">💾 JSON Backup exportieren</button>' +
      '<label class="ghost" style="display:inline-flex; align-items:center; justify-content:center; margin:0; border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; background:var(--panel2); color:var(--ink); font-size:0.9rem;">' +
        '📂 JSON Backup importieren <input type="file" id="import_file_input" accept=".json" style="display:none;" data-chg="importJSON">' +
      '</label>' +
    '</div>' +

    '<div class="actions" style="margin-top:24px;justify-content:flex-end;">' +
      '<button class="ghost" data-act="closeDlg">Abbrechen</button>' +
      '<button class="primary" data-act="saveSettings">Speichern</button>' +
    '</div>';
  
  if (!dlg.open) dlg.showModal();

function openTalentModal(teamId, editId) {
  var cs = currentSeason();
  if (!cs) return;

  var t = null;
  if (editId) {
    ui.editTalent = editId;
    t = cs.talents.find(function(x){ return x.id === editId; });
    teamId = t.teamId;
  } else {
    ui.editTalent = null;
  }

  var currentRealId = t ? (t.realTeamId || "") : "";
  var currentBuzzers = t ? (t.buzzers || 1) : 1;
  var currentTeamId = teamId || (cs.teams.length > 0 ? cs.teams[0].id : "");

  var fakeTeamButtonsHtml = '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;" id="fake_team_btn_group">';
  var activeTeams = cs.teams.slice(0, cs.teamCount);
  for(var i = 0; i < activeTeams.length; i++) {
    var tm = activeTeams[i];
    var isSelectedF = currentTeamId === tm.id;
    fakeTeamButtonsHtml += '<button type="button" class="fk-pick-btn ' + (isSelectedF ? "primary" : "ghost") + '" data-teamid="' + tm.id + '" style="flex:1; min-width:90px; font-weight:700;">' + esc(tm.name) + '</button>';
  }
  fakeTeamButtonsHtml += '</div>';

  var realButtonsHtml = '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;" id="real_team_btn_group">';
  if (cs.realTeams) {
    for(var i = 0; i < cs.realTeams.length; i++) {
      var rt = cs.realTeams[i];
      var isSelected = currentRealId === rt.id;
      realButtonsHtml += '<button type="button" class="rt-pick-btn ' + (isSelected ? "primary" : "ghost") + '" data-realid="' + rt.id + '" style="flex:1; min-width:100px; border-color:' + (rt.color || 'var(--line)') + '">' + esc(rt.name) + '</button>';
    }
  }
  realButtonsHtml += '</div>';

  var isNoTeamSelected = currentRealId === "";

function openStealModal() {
  var cs = currentSeason();
  if (!cs) return;

  var stageTalents = cs.talents.filter(function(t){ return t.stageId === ui.tab; });
  var eliminatedTalents = stageTalents.filter(function(t){ return t.status === 'eliminated'; });

  if (eliminatedTalents.length === 0) {
    showCustomAlert("Es sind aktuell keine ausgeschiedenen Talente in diesem Abschnitt vorhanden, die geklaut werden könnten.");
    return;
  }

  var talentOpts = '';
  for (var i = 0; i < eliminatedTalents.length; i++) {
    var et = eliminatedTalents[i];
    var tObj = cs.teams.find(function(m){ return m.id === et.teamId; }) || {};
    talentOpts += '<option value="'+et.id+'">' + esc(et.name) + ' (bisher: ' + esc(tObj.name || '') + ')</option>';
  }

  var realTeamOpts = '';
  if (cs.realTeams) {
    for(var i=0; i<cs.realTeams.length; i++){
      var rt = cs.realTeams[i];
      realTeamOpts += '<option value="'+rt.id+'">'+esc(rt.name)+' ('+esc(rt.initial)+')</option>';
    }
  }

  var teamOpts = '';
  var activeTeams = cs.teams.slice(0, cs.teamCount);
  for(var i=0; i<activeTeams.length; i++){
    var tm = activeTeams[i];
    teamOpts += '<option value="'+tm.id+'">'+esc(tm.name)+'</option>';
  }

  dlg.innerHTML = '<h3>🔄 Steal-Deal durchführen</h3>' +
    '<p class="hint">Wähle ein ausgeschiedenes Talent und weise es einem neuen Coach / Fake-Team zu.</p>' +
    '<label>Ausgeschiedenes Talent<select id="steal_talent_sel">' + talentOpts + '</select></label>' +
    '<label>Neuer Realer Coach / Team<select id="steal_real">' + realTeamOpts + '</select></label>' +
    '<label>Neues Fake-Team<select id="steal_team">' + teamOpts + '</select></label>' +
    '<div class="actions" style="margin-top:20px; justify-content:flex-end;">' +
      '<button class="ghost" data-act="closeDlg">Abbrechen</button>' +
      '<button class="primary" data-act="saveSteal">Steal bestätigen</button>' +
    '</div>';

  if (!dlg.open) dlg.showModal();
}

function openBattleModal() {

    var talId = ui.selectedTalents[i];

function openCoachStatsModal() {

  var stageTalents = cs.talents.filter(function(t){ return t.stageId === ui.tab; });

    statsHtml = '<p class="empty">Keine realen Teams in den Einstellungen definiert.</p>';

    for (var i = 0; i < cs.realTeams.length; i++) {
      var rt = cs.realTeams[i];

      var colorDot = '<span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:' + (rt.color || '#e62a2a') + '; margin-right:6px; vertical-align:middle;"></span>';

                     '<div>' +

                     '</div>' +

                       '<span style="color:var(--ink);">Gesamt: ' + rtTalents.length + '</span>' +

    if (nextStage) {
      var exists = cs.talents.some(function(existing){
        return existing.stageId === nextStage.id && existing.name.toLowerCase() === t.name.toLowerCase();

        cs.talents.push({

  saveBattle: function() {
    var cs = currentSeason();
    if (!cs) return "keep";

    var currentStageIdx = cs.stages.findIndex(function(st){ return st.id === ui.tab; });
    var nextStage = (currentStageIdx !== -1 && currentStageIdx < cs.stages.length - 1) ? cs.stages[currentStageIdx + 1] : null;

    var tempUpdatedTalents = [];
    ui.highlightTalentIds = [];

    for (var i = 0; i < ui.selectedTalents.length; i++) {
      var talId = ui.selectedTalents[i];
      var t = cs.talents.find(function(x){ return x.id === talId; });
      if (!t) continue;

      var hiddenInput = $("#status_val_" + t.id);
      if (!hiddenInput) continue;

      var newStatus = hiddenInput.value;
      t.status = newStatus;
      ui.highlightTalentIds.push(t.id);

      var teamObj = cs.teams.find(function(tm){ return tm.id === t.teamId; }) || {};
      tempUpdatedTalents.push({ name: t.name, status: newStatus, teamName: teamObj.name || "Team" });

      if (newStatus === 'advanced' && nextStage) {
        var exists = cs.talents.some(function(existing){
          return existing.stageId === nextStage.id && existing.name.toLowerCase() === t.name.toLowerCase();
        });
        if (!exists) {
          cs.talents.push({
            id: "tal_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
            stageId: nextStage.id,
            teamId: t.teamId,
            name: t.name,
            buzzers: t.buzzers,
            realTeamId: t.realTeamId,
            status: "active",
            isAllStar: t.isAllStar,
            isSteal: t.isSteal
          });
        }
      } else if ((newStatus === 'eliminated' || newStatus === 'active') && nextStage) {
        cs.talents = cs.talents.filter(function(existing){
          return !(existing.stageId === nextStage.id && existing.name.toLowerCase() === t.name.toLowerCase());

    }

    ui.selectedTalents = [];

    var animListHtml = '';

                        '</div>' +
                        '<div style="padding:4px 12px; border-radius:6px; font-weight:700; font-size:0.9rem; ' + statusBadgeStyle + '">' + statusText + '</div>' +
                      '</div>';

                      '<h3 style="color:var(--gold); font-size:1.4rem; margin-bottom:6px;">✨ Ergebnisse gespeichert!</h3>' +
                      '<p class="hint">Übersicht der Aktualisierungen:</p>' +
                      '<div style="max-height:280px; overflow-y:auto; text-align:left; margin-top:12px;">' + animListHtml + '</div>' +
                    '</div>';

    setTimeout(function(){
      dlg.close();
      ui.enter = true;

        ui.highlightTalentIds = [];

              realTeamId: realTeamId,
              status: "active",
              isAllStar: isAllStar,
              isSteal: false
            });
          }
        }
      }
    }
    save(); dlg.close(); ui.enter = true;
  }
};

document.addEventListener("click", function(ev){
  var fkBtn = ev.target.closest(".fk-pick-btn");
  if (fkBtn) {
    var groupF = document.querySelectorAll(".fk-pick-btn");
    for (var i = 0; i < groupF.length; i++) {
      groupF[i].className = "ghost fk-pick-btn";
    }
    fkBtn.className = "primary fk-pick-btn";
    var valInpF = $("#tal_team_val");
    if (valInpF) valInpF.value = fkBtn.dataset.teamid;
  }

  var rtBtn = ev.target.closest(".rt-pick-btn");
  if (rtBtn) {
    var group = document.querySelectorAll(".rt-pick-btn");
    for (var i = 0; i < group.length; i++) {
      group[i].className = "ghost rt-pick-btn";
    }
    rtBtn.className = "primary rt-pick-btn";
    var valInp = $("#tal_real_val");
    if (valInp) valInp.value = rtBtn.dataset.realid;
  }

  var bzBtn = ev.target.closest(".bz-pick-btn");
  if (bzBtn) {
    var groupB = document.querySelectorAll(".bz-pick-btn");
    for (var i = 0; i < groupB.length; i++) {
      groupB[i].className = "ghost bz-pick-btn";
    }
    bzBtn.className = "primary bz-pick-btn";
    var valInpB = $("#tal_buzz_val");
    if (valInpB) valInpB.value = bzBtn.dataset.buzz;
  }

  // Klicks für die Status-Buttons im Battle-Modus (mit Toggle auf 'active' beim erneuten Klick)
  var statusBtn = ev.target.closest(".status-btn");
  if (statusBtn) {
    var talId = statusBtn.dataset.talid;
    var clickedStatus = statusBtn.dataset.status;
    var hiddenInput = $("#status_val_" + talId);
    if (!hiddenInput) return;

    var currentVal = hiddenInput.value;
    var newStatus = (currentVal === clickedStatus) ? 'active' : clickedStatus;

    hiddenInput.value = newStatus;

    var parentContainer = statusBtn.closest("div");
    if (parentContainer) {
      var allBtns = parentContainer.querySelectorAll(".status-btn");
      for (var i = 0; i < allBtns.length; i++) {
        var b = allBtns[i];
        var bStatus = b.dataset.status;
        b.className = "ghost status-btn";
        if (bStatus === 'advanced') {
          b.style.color = "var(--green)";
          b.style.background = "transparent";
        } else if (bStatus === 'eliminated') {
          b.style.color = "var(--red)";
          b.style.background = "transparent";
        }
      }
    }

    if (newStatus !== 'active') {
      statusBtn.className = "primary status-btn";
      statusBtn.style.color = "#fff";
      if (newStatus === 'advanced') {
        statusBtn.style.background = "var(--green)";
        statusBtn.style.borderColor = "var(--green)";
      } else if (newStatus === 'eliminated') {
        statusBtn.style.background = "var(--red)";
        statusBtn.style.borderColor = "var(--red)";
      }
    }
  }
});

document.addEventListener("change", function(ev){
  if(ev.target.dataset.chg === "teamCount") {
    var count = parseInt(ev.target.value);
    var labels = document.querySelectorAll(".team-name-input");
    for(var i = 0; i < labels.length; i++) {
      labels[i].style.display = i < count ? "flex" : "none";
    }
  }

  if(ev.target.dataset.chg === "importJSON") {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var parsed = JSON.parse(e.target.result);
        if (parsed && parsed.seasons) {
          S = parsed;
          save();
          dlg.close();
          ui.view = "home";
          ui.seasonId = null;
          render();
          showCustomAlert("Backup erfolgreich importiert!");
        } else {
          showCustomAlert("Ungültiges Dateiformat.");
        }
      } catch(err) {
        showCustomAlert("Fehler beim Lesen der JSON-Datei.");
      }
    };
    reader.readAsText(file);
  }
});

document.addEventListener("click", function(ev) {
  var t = ev.target.closest("[data-act]"); 
  if(!t || !A[t.dataset.act]) return;
  var r = A[t.dataset.act](t);
  if(r !== "keep") render();
});

render();
if(DB){ pull(true); setInterval(pull, 4000); }
</script>
